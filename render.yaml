services:
  - type: web
    name: ricochet-robots
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAX_PLAYERS
        value: "30"
      - key: COUNTDOWN_SECONDS
        value: "60"
      - key: REVEAL_SECONDS
        value: "10"
